<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="100%" height="416">
  <defs>
    <linearGradient id="winSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111115"/>
    </linearGradient>
    <linearGradient id="progressSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    <clipPath id="winClip">
      <rect x="1" y="1" width="958" height="414" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }

    @keyframes fadePrompt {
      0%, 4% { opacity: 0; transform: translateY(4px); }
      12%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes fadeStatus {
      0%, 14% { opacity: 0; }
      22%, 92% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes loadLine {
      0%, 14% { width: 0px; opacity: 0; }
      18% { opacity: 1; }
      34% { width: 896px; opacity: 1; }
      92% { width: 896px; opacity: 0.35; }
      100% { width: 0px; opacity: 0; }
    }
    @keyframes card1 {
      0%, 32% { opacity: 0; transform: translateY(6px); }
      40%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes card2 {
      0%, 42% { opacity: 0; transform: translateY(6px); }
      50%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes card3 {
      0%, 52% { opacity: 0; transform: translateY(6px); }
      60%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes card4 {
      0%, 62% { opacity: 0; transform: translateY(6px); }
      70%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes caret {
      0%, 49% { opacity: 0.9; }
      50%, 100% { opacity: 0; }
    }

    .s-prompt { animation: fadePrompt 10s ease-out infinite; }
    .s-status { animation: fadeStatus 10s ease-out infinite; }
    .s-bar { animation: loadLine 10s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .k1 { animation: card1 10s ease-out infinite; }
    .k2 { animation: card2 10s ease-out infinite; }
    .k3 { animation: card3 10s ease-out infinite; }
    .k4 { animation: card4 10s ease-out infinite; }
    .caret { animation: caret 1.1s step-end infinite; }
  </style>

  <g clip-path="url(#winClip)">
    <!-- Canvas -->
    <rect x="0" y="0" width="960" height="416" fill="url(#winSurface)"/>

    <!-- Minimal Header Bar -->
    <rect x="0" y="0" width="960" height="42" fill="#0d0d11"/>
    <line x1="0" y1="42" x2="960" y2="42" stroke="#1f1f23" stroke-width="1"/>
    <circle cx="24" cy="21" r="4.5" fill="#3f3f46"/>
    <circle cx="40" cy="21" r="4.5" fill="#3f3f46"/>
    <circle cx="56" cy="21" r="4.5" fill="#3f3f46"/>
    <text x="480" y="25" text-anchor="middle" fill="#71717a" font-size="12" letter-spacing="1" class="mono">oss-quick-brief · workflow</text>

    <!-- Prompt Row -->
    <g class="s-prompt">
      <rect x="32" y="62" width="896" height="48" rx="10" fill="#131317" stroke="#27272a" stroke-width="1"/>
      <text x="52" y="91" fill="#71717a" font-size="13" class="mono">&gt;</text>
      <text x="72" y="91" fill="#f4f4f5" font-size="14.5" class="sans">帮我快速了解一下 https://github.com/astral-sh/uv 这个项目</text>
      <rect class="caret" x="506" y="77" width="1.8" height="17" fill="#e4e4e7"/>
    </g>

    <!-- Status + Ultra-Thin Progress Hairline -->
    <g class="s-status">
      <text x="34" y="134" fill="#71717a" font-size="12" letter-spacing="0.4" class="mono">READING README &amp; EXAMPLES · SKIPPING SOURCE TREE · TRANSLATING JARGON</text>
    </g>
    <rect x="32" y="146" width="896" height="1.5" rx="0.75" fill="#1f1f23"/>
    <rect class="s-bar" x="32" y="146" width="0" height="1.5" rx="0.75" fill="url(#progressSilver)"/>

    <!-- 2x2 Refined Editorial Cards -->
    <!-- 01 What -->
    <g class="k1">
      <rect x="32" y="168" width="438" height="104" rx="12" fill="#121216" stroke="#27272a" stroke-width="1"/>
      <text x="52" y="196" fill="#a5b4fc" font-size="12" font-weight="600" letter-spacing="1" class="mono">01 / WHAT</text>
      <text x="450" y="196" text-anchor="end" fill="#52525b" font-size="12" class="sans">干嘛的</text>
      <text x="52" y="226" fill="#f4f4f5" font-size="14" font-weight="500" class="sans">把 pip、venv、pyenv 合二为一的极速环境管家</text>
      <text x="52" y="250" fill="#a1a1aa" font-size="12.5" class="sans">像全包施工队一样，一条命令搞定装库与隔离环境。</text>
    </g>

    <!-- 02 Why -->
    <g class="k2">
      <rect x="490" y="168" width="438" height="104" rx="12" fill="#121216" stroke="#27272a" stroke-width="1"/>
      <text x="510" y="196" fill="#a5b4fc" font-size="12" font-weight="600" letter-spacing="1" class="mono">02 / WHY</text>
      <text x="908" y="196" text-anchor="end" fill="#52525b" font-size="12" class="sans">为什么</text>
      <text x="510" y="226" fill="#f4f4f5" font-size="14" font-weight="500" class="sans">告别 pip 装包慢、工具杂、依赖冲突痛点</text>
      <text x="510" y="250" fill="#a1a1aa" font-size="12.5" class="sans">Rust 重写快 10~100 倍，附 pip / Conda 选型对比。</text>
    </g>

    <!-- 03 How -->
    <g class="k3">
      <rect x="32" y="288" width="438" height="104" rx="12" fill="#121216" stroke="#27272a" stroke-width="1"/>
      <text x="52" y="316" fill="#a5b4fc" font-size="12" font-weight="600" letter-spacing="1" class="mono">03 / HOW</text>
      <text x="450" y="316" text-anchor="end" fill="#52525b" font-size="12" class="sans">怎么用</text>
      <text x="52" y="346" fill="#e4e4e7" font-size="13" class="mono">$ uv init my-demo &amp;&amp; uv add requests</text>
      <text x="52" y="370" fill="#a1a1aa" font-size="12.5" class="sans">避坑：纯免费本地运行，装完找不到命令重启终端即可。</text>
    </g>

    <!-- 04 Decision -->
    <g class="k4">
      <rect x="490" y="288" width="438" height="104" rx="12" fill="#121216" stroke="#27272a" stroke-width="1"/>
      <text x="510" y="316" fill="#a5b4fc" font-size="12" font-weight="600" letter-spacing="1" class="mono">04 / DECISION</text>
      <text x="908" y="316" text-anchor="end" fill="#52525b" font-size="12" class="sans">学习建议</text>
      <text x="510" y="346" fill="#f4f4f5" font-size="14" font-weight="500" class="sans">难度 ★☆☆ · 值得花 10 分钟装上替代 pip</text>
      <text x="510" y="370" fill="#a1a1aa" font-size="12.5" class="sans">文末附 3 个追问入口，按需再看原理或跑通 Demo。</text>
    </g>
  </g>

  <!-- Crisp 1px Outer Frame -->
  <rect x="1" y="1" width="958" height="414" rx="16" fill="none" stroke="#27272a" stroke-width="1"/>
</svg>
