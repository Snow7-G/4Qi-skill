<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="420">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    @keyframes step1 {
      0%, 5% { opacity: 0; transform: translateY(6px); }
      12%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes progressBar {
      0%, 12% { width: 0px; opacity: 0; }
      16% { opacity: 1; }
      32% { width: 320px; opacity: 1; }
      92% { width: 320px; opacity: 1; }
      100% { width: 0px; opacity: 0; }
    }
    @keyframes step2 {
      0%, 14% { opacity: 0; transform: translateY(6px); }
      22%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes cardA {
      0%, 30% { opacity: 0; transform: translateY(10px); }
      38%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes cardB {
      0%, 42% { opacity: 0; transform: translateY(10px); }
      50%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes cardC {
      0%, 54% { opacity: 0; transform: translateY(10px); }
      62%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes cardD {
      0%, 66% { opacity: 0; transform: translateY(10px); }
      74%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .s1 { animation: step1 9s ease-out infinite; }
    .s2 { animation: step2 9s ease-out infinite; }
    .pbar { animation: progressBar 9s ease-in-out infinite; }
    .c1 { animation: cardA 9s ease-out infinite; }
    .c2 { animation: cardB 9s ease-out infinite; }
    .c3 { animation: cardC 9s ease-out infinite; }
    .c4 { animation: cardD 9s ease-out infinite; }
    .cursor { animation: blink 1s step-end infinite; }
  </style>

  <!-- Solid Window Frame -->
  <rect x="2" y="2" width="956" height="416" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Solid Title Bar -->
  <path d="M 2 18 Q 2 2 18 2 L 942 2 Q 958 2 958 18 L 958 42 L 2 42 Z" fill="#1e293b"/>
  <line x1="2" y1="42" x2="958" y2="42" stroke="#334155" stroke-width="1"/>
  <circle cx="24" cy="22" r="6" fill="#ef4444"/>
  <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="22" r="6" fill="#10b981"/>
  <text x="480" y="27" text-anchor="middle" fill="#94a3b8" font-size="13" class="mono">oss-quick-brief · 工作流动态演示</text>

  <!-- Step 1: User Prompt -->
  <g class="s1">
    <rect x="28" y="60" width="904" height="48" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="42" y="72" width="54" height="24" rx="6" fill="#0284c7"/>
    <text x="69" y="88" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600" class="sans">学生</text>
    <text x="112" y="89" fill="#f8fafc" font-size="15" class="sans">“帮我快速了解一下 https://github.com/astral-sh/uv 这个项目，看不懂文档…”</text>
    <rect class="cursor" x="664" y="74" width="2.5" height="19" fill="#38bdf8"/>
  </g>

  <!-- Step 2: Skill Processing -->
  <g class="s2">
    <text x="34" y="135" fill="#94a3b8" font-size="13" class="mono">⚡ 触发 oss-quick-brief：只读 README &amp; 示例 · 严禁深挖源码 · 过滤营销废话 · 翻译生僻术语</text>
    <rect x="34" y="146" width="320" height="6" rx="3" fill="#1e293b"/>
    <rect class="pbar" x="34" y="146" width="0" height="6" rx="3" fill="#38bdf8"/>
  </g>

  <!-- Step 3: Flat Solid 2x2 Cards -->
  <!-- Card 1: What -->
  <g class="c1">
    <rect x="28" y="170" width="442" height="106" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="44" y="184" width="112" height="24" rx="6" fill="#0c4a6e"/>
    <text x="100" y="200" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700" class="sans">1. 干嘛的 (What)</text>
    <text x="168" y="200" fill="#94a3b8" font-size="12" class="mono">★☆☆ · 25字定位 + 生活类比</text>
    <text x="44" y="230" fill="#f1f5f9" font-size="14" class="sans">把 pip、venv、pyenv 合二为一的“极速环境管家”，</text>
    <text x="44" y="253" fill="#94a3b8" font-size="13" class="sans">像全包施工队一样，一条命令搞定装库和隔离环境。</text>
  </g>

  <!-- Card 2: Why -->
  <g class="c2">
    <rect x="490" y="170" width="442" height="106" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
    <rect x="506" y="184" width="112" height="24" rx="6" fill="#4c1d95"/>
    <text x="562" y="200" text-anchor="middle" fill="#ddd6fe" font-size="12" font-weight="700" class="sans">2. 为什么 (Why)</text>
    <text x="630" y="200" fill="#94a3b8" font-size="12" class="mono">痛点对比 + 同类区分</text>
    <text x="506" y="230" fill="#f1f5f9" font-size="14" class="sans">解决 pip 装包慢、工具杂、易冲突的历史痛点，</text>
    <text x="506" y="253" fill="#94a3b8" font-size="13" class="sans">Rust 重写快 10~100 倍 · 附 pip / Conda 选型表。</text>
  </g>

  <!-- Card 3: How -->
  <g class="c3">
    <rect x="28" y="292" width="442" height="106" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <rect x="44" y="306" width="112" height="24" rx="6" fill="#065f46"/>
    <text x="100" y="322" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700" class="sans">3. 怎么用 (How)</text>
    <text x="168" y="322" fill="#94a3b8" font-size="12" class="mono">≤15行最小体验 + 避坑</text>
    <text x="44" y="352" fill="#6ee7b7" font-size="13" class="mono">$ uv init my-demo &amp;&amp; uv add requests</text>
    <text x="44" y="376" fill="#94a3b8" font-size="13" class="sans">避坑：纯免费本地运行，装完找不到命令重启终端即可。</text>
  </g>

  <!-- Card 4: Decision -->
  <g class="c4">
    <rect x="490" y="292" width="442" height="106" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="506" y="306" width="124" height="24" rx="6" fill="#78350f"/>
    <text x="568" y="322" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700" class="sans">4. 学习小贴士</text>
    <text x="642" y="322" fill="#94a3b8" font-size="12" class="mono">3 分钟看完即做决策</text>
    <text x="506" y="352" fill="#fef3c7" font-size="14" class="sans">前置：会基础 Python · 建议：花 10 分钟装上提效</text>
    <text x="506" y="376" fill="#94a3b8" font-size="13" class="sans">文末附 3 个一键追问方向，按需再看原理或跑 Demo。</text>
  </g>
</svg>
