<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280">
  <defs>
    <!-- Deep Obsidian Silk Surface -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="55%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>

    <!-- Subtle Pearlescent Top Glow -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#e4e4e7" stop-opacity="0.11"/>
      <stop offset="55%" stop-color="#a5b4fc" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <!-- Refined Silver-White Title Gradient -->
    <linearGradient id="silverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <!-- Hairline Specular Highlight -->
    <linearGradient id="hairlineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e4e4e7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Divider Fade -->
    <linearGradient id="dividerFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3f3f46" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#3f3f46" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frameClip">
      <rect x="1" y="1" width="958" height="278" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }

    @keyframes breathe {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    @keyframes glide {
      0% { transform: translateX(-260px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(1020px); opacity: 0; }
    }
    @keyframes focus1 {
      0%, 100% { fill: #fafafa; }
      33%, 66% { fill: #71717a; }
    }
    @keyframes focus2 {
      0%, 66%, 100% { fill: #71717a; }
      33% { fill: #fafafa; }
    }
    @keyframes focus3 {
      0%, 33%, 100% { fill: #71717a; }
      66% { fill: #fafafa; }
    }
    @keyframes dotSlide {
      0%, 100% { transform: translateX(0px); }
      33% { transform: translateX(176px); }
      66% { transform: translateX(352px); }
    }

    .ambient { animation: breathe 8s ease-in-out infinite; }
    .specular { animation: glide 7s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .t1 { animation: focus1 7.5s ease-in-out infinite; }
    .t2 { animation: focus2 7.5s ease-in-out infinite; }
    .t3 { animation: focus3 7.5s ease-in-out infinite; }
    .dot-slide { animation: dotSlide 7.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  </style>

  <g clip-path="url(#frameClip)">
    <!-- Background -->
    <rect x="0" y="0" width="960" height="280" fill="url(#canvasBg)"/>
    <ellipse class="ambient" cx="480" cy="0" rx="520" ry="190" fill="url(#topGlow)"/>

    <!-- Subtle Architectural Horizontal Rules -->
    <rect x="0" y="1" width="220" height="1.5" fill="url(#hairlineGlow)" class="specular"/>

    <!-- Minimal Eyebrow -->
    <text x="480" y="58" text-anchor="middle" fill="#a1a1aa" font-size="11.5" font-weight="500" letter-spacing="3.5" class="mono">4QI · AGENT SKILLS</text>

    <!-- Monumental Clean Title -->
    <text x="480" y="128" text-anchor="middle" fill="url(#silverText)" font-size="54" font-weight="700" letter-spacing="-0.5" class="sans">4Qi-skill</text>

    <!-- Calm Spaced Subtitle -->
    <text x="480" y="168" text-anchor="middle" fill="#a1a1aa" font-size="17" font-weight="400" letter-spacing="1.2" class="sans">面向计算机学生的开源认知技能 · 三分钟看懂任意项目</text>

    <!-- Fine Divider -->
    <rect x="180" y="202" width="600" height="1" fill="url(#dividerFade)"/>

    <!-- Minimal Footer Pillars -->
    <g transform="translate(244, 234)">
      <text x="60" y="0" text-anchor="middle" font-size="13.5" font-weight="500" letter-spacing="1" class="sans t1">What · 干嘛的</text>
      <circle cx="148" cy="-4" r="1.5" fill="#3f3f46"/>
      <text x="236" y="0" text-anchor="middle" font-size="13.5" font-weight="500" letter-spacing="1" class="sans t2">Why · 为什么</text>
      <circle cx="324" cy="-4" r="1.5" fill="#3f3f46"/>
      <text x="412" y="0" text-anchor="middle" font-size="13.5" font-weight="500" letter-spacing="1" class="sans t3">How · 怎么用</text>

      <!-- Delicate Active Underline -->
      <rect class="dot-slide" x="34" y="12" width="52" height="1.5" rx="0.75" fill="#e4e4e7"/>
    </g>
  </g>

  <!-- Crisp 1px Outer Frame -->
  <rect x="1" y="1" width="958" height="278" rx="16" fill="none" stroke="#27272a" stroke-width="1"/>
</svg>
