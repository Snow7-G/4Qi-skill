<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="956" height="276" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pill1 {
      0%, 100% { stroke: #38bdf8; fill: #172554; }
      33%, 66% { stroke: #334155; fill: #1e293b; }
    }
    @keyframes pill2 {
      0%, 66%, 100% { stroke: #334155; fill: #1e293b; }
      33% { stroke: #a78bfa; fill: #2e1065; }
    }
    @keyframes pill3 {
      0%, 33%, 100% { stroke: #334155; fill: #1e293b; }
      66% { stroke: #10b981; fill: #064e3b; }
    }
    @keyframes barSlide {
      0%, 100% { transform: translateX(0px); fill: #38bdf8; }
      33% { transform: translateX(184px); fill: #a78bfa; }
      66% { transform: translateX(368px); fill: #10b981; }
    }

    .dot-pulse { animation: pulseDot 1.8s ease-in-out infinite; }
    .cursor-blink { animation: blinkCursor 1.1s step-end infinite; }
    .p1 { animation: pill1 5.4s ease-in-out infinite; }
    .p2 { animation: pill2 5.4s ease-in-out infinite; }
    .p3 { animation: pill3 5.4s ease-in-out infinite; }
    .indicator { animation: barSlide 5.4s ease-in-out infinite; }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Solid Flat Background -->
    <rect x="0" y="0" width="960" height="280" fill="#0f172a"/>
    <rect x="0" y="0" width="960" height="280" fill="url(#dots)"/>

    <!-- Clean Geometric Corner Accents -->
    <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 916 24 L 936 24 L 936 44" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 24 236 L 24 256 L 44 256" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 916 256 L 936 256 L 936 236" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Top Status Pill -->
    <rect x="305" y="34" width="350" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle class="dot-pulse" cx="327" cy="50" r="4.5" fill="#10b981"/>
    <text x="488" y="55" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500" class="font-mono">AI Agent Skills · Antigravity Ready</text>

    <!-- Main Title (Solid Crisp Colors) -->
    <text x="472" y="130" text-anchor="middle" font-size="52" font-weight="800" letter-spacing="1.5" class="font-sans">
      <tspan fill="#ffffff">4Qi</tspan><tspan fill="#38bdf8">-skill</tspan>
    </text>
    <rect class="cursor-blink" x="596" y="92" width="5" height="42" rx="2" fill="#38bdf8"/>

    <!-- Subtitle -->
    <text x="480" y="168" text-anchor="middle" fill="#cbd5e1" font-size="19" font-weight="500" class="font-sans">面向计算机学生的 AI 技能库 · 让陌生开源项目 3 分钟祛魅</text>

    <!-- Flat Feature Pills + Animated Active Bar -->
    <g transform="translate(216, 198)">
      <rect class="p1" x="0" y="0" width="160" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="80" y="24" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="600" class="font-sans">What · 干嘛的</text>

      <rect class="p2" x="184" y="0" width="160" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="264" y="24" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="600" class="font-sans">Why · 为什么</text>

      <rect class="p3" x="368" y="0" width="160" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="448" y="24" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="600" class="font-sans">How · 怎么用</text>

      <!-- Sliding Flat Indicator -->
      <rect class="indicator" x="40" y="46" width="80" height="4" rx="2" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Crisp Solid Border -->
  <rect x="2" y="2" width="956" height="276" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
</svg>
