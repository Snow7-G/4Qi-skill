<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="320">
  <defs>
    <linearGradient id="obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0e"/>
      <stop offset="50%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#09090c"/>
    </linearGradient>
    <radialGradient id="pearlGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#f4f1ea" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#c7d2fe" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#09090c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ivoryTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="100%" stop-color="#b8b4ac"/>
    </linearGradient>
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6cbb8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#d6cbb8" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#d6cbb8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d6cbb8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="heroClip">
      <rect x="1" y="1" width="958" height="318" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .serif { font-family: "New York", "Iowan Old Style", Georgia, "Songti SC", "STSong", "Noto Serif CJK SC", serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }

    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes slowSpinRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes gentleFade {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    @keyframes pillar1 {
      0%, 100% { fill: #f5f2eb; }
      33%, 66% { fill: #78756e; }
    }
    @keyframes pillar2 {
      0%, 66%, 100% { fill: #78756e; }
      33% { fill: #f5f2eb; }
    }
    @keyframes pillar3 {
      0%, 33%, 100% { fill: #78756e; }
      66% { fill: #f5f2eb; }
    }

    .ring-outer { animation: slowSpin 90s linear infinite; transform-origin: 480px 156px; }
    .ring-inner { animation: slowSpinRev 65s linear infinite; transform-origin: 480px 156px; }
    .aura { animation: gentleFade 9s ease-in-out infinite; }
    .p1 { animation: pillar1 9s ease-in-out infinite; }
    .p2 { animation: pillar2 9s ease-in-out infinite; }
    .p3 { animation: pillar3 9s ease-in-out infinite; }
  </style>

  <g clip-path="url(#heroClip)">
    <!-- Canvas -->
    <rect x="0" y="0" width="960" height="320" fill="url(#obsidian)"/>
    <ellipse class="aura" cx="480" cy="148" rx="460" ry="180" fill="url(#pearlGlow)"/>

    <!-- Architectural Concentric Orbits (Subtle Precision Instrument) -->
    <g opacity="0.22">
      <circle cx="480" cy="156" r="196" fill="none" stroke="#d6cbb8" stroke-width="0.7" stroke-dasharray="2 8" class="ring-outer"/>
      <circle cx="480" cy="156" r="138" fill="none" stroke="#a1a1aa" stroke-width="0.6" stroke-dasharray="1 10" class="ring-inner"/>
      <line x1="80" y1="156" x2="220" y2="156" stroke="#3f3f46" stroke-width="0.7"/>
      <line x1="740" y1="156" x2="880" y2="156" stroke="#3f3f46" stroke-width="0.7"/>
      <circle cx="220" cy="156" r="2" fill="#d6cbb8" fill-opacity="0.6"/>
      <circle cx="740" cy="156" r="2" fill="#d6cbb8" fill-opacity="0.6"/>
    </g>

    <!-- Corner Framing Marks -->
    <g stroke="#3f3f46" stroke-width="1" fill="none">
      <path d="M 24 38 L 24 24 L 38 24"/>
      <path d="M 922 24 L 936 24 L 936 38"/>
      <path d="M 24 282 L 24 296 L 38 296"/>
      <path d="M 922 296 L 936 296 L 936 282"/>
    </g>

    <!-- Eyebrow -->
    <text x="480" y="64" text-anchor="middle" fill="#a8a29e" font-size="11" font-weight="400" letter-spacing="4.5" class="mono">OPEN SOURCE CLARITY · AGENT SKILLS</text>

    <!-- Editorial Serif Main Title -->
    <text x="480" y="148" text-anchor="middle" fill="url(#ivoryTitle)" font-size="64" font-weight="400" letter-spacing="2" class="serif">
      <tspan>4Qi</tspan><tspan font-style="italic" fill="#d6cbb8" font-size="56"> · skill</tspan>
    </text>

    <!-- Spaced Poetic Subtitle -->
    <text x="480" y="196" text-anchor="middle" fill="#d4d4d8" font-size="16" font-weight="300" letter-spacing="4.5" class="sans">繁复源码，三分钟归简</text>

    <!-- Delicate Gold-Champagne Hairline -->
    <rect x="200" y="232" width="560" height="0.8" fill="url(#goldRule)"/>

    <!-- Classical Roman Numeral Footer -->
    <g transform="translate(0, 268)">
      <text x="290" y="0" text-anchor="middle" font-size="13" letter-spacing="2" class="serif p1">I.  干嘛的</text>
      <text x="385" y="-1" text-anchor="middle" fill="#3f3f46" font-size="12" class="serif">/</text>
      <text x="480" y="0" text-anchor="middle" font-size="13" letter-spacing="2" class="serif p2">II.  为什么</text>
      <text x="575" y="-1" text-anchor="middle" fill="#3f3f46" font-size="12" class="serif">/</text>
      <text x="670" y="0" text-anchor="middle" font-size="13" letter-spacing="2" class="serif p3">III.  怎么用</text>
    </g>
  </g>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="958" height="318" rx="14" fill="none" stroke="#27272a" stroke-width="1"/>
</svg>
